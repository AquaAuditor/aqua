<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aqua Auditore</title>
<meta name="description" content="Diario de un jugador: partidas, avances y pensamientos.">
<link rel="icon" type="image/png" href="favicon.png">
<meta property="og:site_name" content="Aqua Auditore">
<meta property="og:type" content="article">
<meta property="og:title" content="Aqua Auditore">
<meta property="og:description" content="Diario de un jugador: partidas, avances y pensamientos.">
<meta property="og:image" content="https://aquaauditor.github.io/aqua/og-logo.jpg">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:        #070C12;
    --bg-soft:   #0E1B26;
    --aqua:      #4FD9E0;
    --aqua-dim:  #1C6E77;
    --text:      #DCEFF1;
    --text-soft: #7C9AA0;
    --line:      rgba(79,217,224,0.14);

    --g-destiny:  #E8A33D;
    --g-mine:     #6FBF73;
    --g-genshin:  #E3C567;
    --g-zzz:      #E85D9E;
    --g-hsr:      #9B7FE0;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3{
    font-family: 'Sora', sans-serif;
    font-weight: 600;
    line-height: 1.2;
    margin: 0;
    letter-spacing: -0.01em;
  }

  a{ color: inherit; text-decoration: none; }
  img{ max-width: 100%; display:block; }

  .wrap{ max-width: 760px; margin: 0 auto; padding: 0 28px; }

  header{ padding: 30px 0 24px; border-bottom: 1px solid var(--line); }
  .header-row{ display:flex; align-items:center; justify-content:space-between; gap: 16px; flex-wrap: wrap; }
  .brand{ display:flex; align-items:center; gap: 14px; }
  .brand img{ width: 40px; height: 40px; border-radius: 50%; box-shadow: 0 0 0 2px var(--bg), 0 0 14px rgba(79,217,224,0.35); }
  .brand-name{ font-size: 1.25rem; font-weight: 700; }
  .brand-name span{ color: var(--aqua); }

  nav ul{ list-style:none; display:flex; gap: 22px; margin:0; padding:0; font-size: 0.92rem; }
  nav a{ color: var(--text-soft); transition: color .15s ease; }
  nav a:hover{ color: var(--aqua); }

  .btn{
    padding: 9px 16px; border-radius: 6px; font-size: 0.85rem; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: var(--text);
    font-family: 'Inter', sans-serif; transition: all .15s ease; display:inline-flex; align-items:center; gap:8px;
  }
  .btn:hover{ border-color: var(--aqua); color: var(--aqua); }

  .article{ padding: 44px 0 70px; }
  .topbar{ display:flex; justify-content:space-between; align-items:center; gap: 12px; flex-wrap:wrap; margin-bottom: 30px; }
  .back{ color: var(--text-soft); font-size: 0.9rem; }
  .back:hover{ color: var(--aqua); }

  .meta{ display:flex; align-items:center; gap: 16px; flex-wrap:wrap; color: var(--text-soft); font-size: 0.88rem; margin-bottom: 14px; }
  .tag{ display:inline-flex; align-items:center; gap: 7px; }
  .dot{ width: 8px; height: 8px; border-radius: 50%; flex-shrink:0; }
  .kind{ color: var(--aqua); }

  .article h1{ font-size: clamp(1.7rem, 4.5vw, 2.5rem); margin-bottom: 22px; }
  .post-image{ border-radius: 10px; width: 100%; margin: 0 0 26px; }
  .video-embed{ position:relative; width:100%; padding-top:56.25%; margin: 0 0 26px; border-radius:10px; overflow:hidden; background:#000; }
  .video-embed iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
  .body{ color: var(--text); font-size: 1.05rem; white-space: pre-line; max-width: 66ch; }

  .thought-mark{ border-left: 2px solid var(--aqua); padding-left: 22px; }

  .state{ color: var(--text-soft); padding: 60px 0; text-align:center; }
  .state a{ color: var(--aqua); }

  footer{ padding: 40px 0 60px; color: var(--text-soft); font-size: 0.88rem; border-top: 1px solid var(--line); }
  footer .wrap{ display:flex; justify-content:space-between; flex-wrap: wrap; gap:12px; }
  footer .social{ display:flex; gap:18px; align-items:center; }
  footer .social a:hover{ color: var(--aqua); }

  @media (max-width: 620px){
    nav ul{ gap: 14px; font-size: 0.85rem; }
  }
</style>
</head>
<body>

  <header>
    <div class="wrap header-row">
      <a class="brand" href="index.html">
        <img id="brand-logo" src="logo.jpg" alt="Emblema Aqua Auditore">
        <div class="brand-name">Aqua <span>Auditore</span></div>
      </a>
      <nav>
        <ul>
          <li><a href="index.html#inicio">Inicio</a></li>
          <li><a href="index.html#diarios">Diarios de juego</a></li>
          <li><a href="index.html#pensamientos">Pensamientos</a></li>
          <li><a href="videos.html">YouTube</a></li>
          <li><a href="index.html#sobre-mi">Sobre mí</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="article">
    <div class="wrap" id="content">
      <p class="state">Cargando...</p>
    </div>
  </main>

  <footer>
    <div class="wrap">
      <span>© 2026 Aqua Auditore</span>
      <div class="social">
        <a href="#" id="link-twitch" target="_blank" rel="noopener">Twitch</a>
        <a href="#" id="link-discord" target="_blank" rel="noopener">Discord</a>
        <a href="#" id="link-x" target="_blank" rel="noopener">X</a>
        <a href="login.html">Iniciar sesión</a>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://dolhldpxkkkyqfqkerbg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRvbGhsZHB4a2treXFmcWtlcmJnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwODE4ODQsImV4cCI6MjEwNDY1Nzg4NH0.kqVg2n8T1p2smpck1uJLQLW07V5s71pidn4SJGaZbSk';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const GAMES = {
      destiny:   {label:'Destiny 2',          color:'var(--g-destiny)'},
      minecraft: {label:'Minecraft',          color:'var(--g-mine)'},
      genshin:   {label:'Genshin Impact',     color:'var(--g-genshin)'},
      zzz:       {label:'Zenless Zone Zero',  color:'var(--g-zzz)'},
      hsr:       {label:'Honkai Star Rail',   color:'var(--g-hsr)'}
    };
    const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

    const SITE_BASE = location.href.replace(/[^/]*(\?.*)?$/, '');
    const postId = new URLSearchParams(location.search).get('id');
    const content = document.getElementById('content');

    function escapeHtml(str){
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    function parseYouTubeId(url){
      if(!url) return null;
      const patterns = [
        /(?:youtube\.com\/watch\?v=)([\w-]{11})/,
        /(?:youtu\.be\/)([\w-]{11})/,
        /(?:youtube\.com\/embed\/)([\w-]{11})/,
        /(?:youtube\.com\/shorts\/)([\w-]{11})/
      ];
      for(const p of patterns){
        const m = url.match(p);
        if(m) return m[1];
      }
      if(/^[\w-]{11}$/.test(url.trim())) return url.trim();
      return null;
    }

    function formatDate(date){
      const [y,m,d] = date.split('-');
      return `${parseInt(d,10)} de ${MONTHS[parseInt(m,10)-1] || ''} de ${y}`;
    }

    function shareLink(){ return `${SITE_BASE}p/${postId}.html`; }

    async function copyLink(btn){
      try {
        await navigator.clipboard.writeText(shareLink());
        btn.textContent = 'Enlace copiado ✓';
        setTimeout(() => btn.textContent = 'Copiar enlace', 2000);
      } catch(e){ prompt('Copia el enlace:', shareLink()); }
    }

    function render(p){
      const isDiario = p.section === 'diario';
      const g = GAMES[p.game] || {label: p.game || '', color:'var(--aqua)'};
      const vid = isDiario ? parseYouTubeId(p.video) : null;

      document.title = `${p.title} — Aqua Auditore`;
      document.querySelector('meta[name="description"]').content = (p.body || '').slice(0, 160);

      content.innerHTML = `
        <div class="topbar">
          <a class="back" href="index.html#${isDiario ? 'diarios' : 'pensamientos'}">← Volver al blog</a>
          <button class="btn" onclick="copyLink(this)">Copiar enlace</button>
        </div>
        <div class="meta">
          <span class="kind">${isDiario ? 'Diario de juego' : 'Pensamiento'}</span>
          <span>${formatDate(p.date)}</span>
          ${isDiario ? `<span class="tag"><span class="dot" style="background:${g.color}"></span>${g.label}</span>` : ''}
        </div>
        <h1>${escapeHtml(p.title)}</h1>
        ${p.image ? `<img class="post-image" src="${p.image}" alt="">` : ''}
        ${vid ? `<div class="video-embed"><iframe src="https://www.youtube-nocookie.com/embed/${vid}" allowfullscreen></iframe></div>` : ''}
        <div class="body ${isDiario ? '' : 'thought-mark'}">${escapeHtml(p.body)}</div>`;
    }

    function renderState(msg){
      content.innerHTML = `<p class="state">${msg}<br><br><a href="index.html">← Volver al blog</a></p>`;
    }

    async function load(){
      if(!postId){ renderState('No se indicó qué entrada mostrar.'); return; }
      const { data, error } = await db.from('posts').select('*').eq('id', postId).maybeSingle();
      if(error){ console.error(error); renderState('No se pudo cargar la entrada.'); return; }
      if(!data){ renderState('Esta entrada ya no existe.'); return; }
      render(data);
    }

    async function loadSiteContent(){
      const { data, error } = await db.from('site_content').select('key,value').in('key', ['logo_image','link_twitch','link_discord','link_x']);
      if(error) return;
      const map = { logo_image:'brand-logo', link_twitch:'link-twitch', link_discord:'link-discord', link_x:'link-x' };
      for(const row of data){
        if(!row.value) continue;
        const el = document.getElementById(map[row.key]);
        if(row.key === 'logo_image') el.src = row.value; else el.href = row.value;
      }
    }

    loadSiteContent();
    load();
  </script>

</body>
</html>
